<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MSTR BTC Per Share Tracker</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
  </head>
  <body class="theme-light">
    <main class="app">
      <header class="topbar">
        <div class="title">
          <h1>Strategy (MSTR) — Bitcoin Per Share</h1>
          <p class="subtitle" id="subtitle"></p>
        </div>
        <label class="switch-row" for="theme-toggle" title="Toggle dark / light mode">
          <span>☀️</span>
          <span class="switch">
            <input id="theme-toggle" type="checkbox" />
            <span class="slider-knob"></span>
          </span>
          <span>🌙</span>
        </label>
      </header>

      <section class="controls">
        <label>
          Interval
          <select id="interval-select">
            <option value="daily">Daily</option>
            <option value="weekly" selected>Weekly</option>
          </select>
        </label>

        <label>
          Chart type
          <select id="chart-type-select">
            <option value="line" selected>Line</option>
            <option value="bar">Histogram</option>
          </select>
        </label>

        <label>
          Share basis
          <select id="basis-select">
            <option value="diluted" selected>Assumed diluted (official)</option>
            <option value="basic">Basic (Class A+B)</option>
          </select>
        </label>

        <label>
          Your MSTR shares
          <input id="owned-shares" type="number" min="0" step="1" value="0" placeholder="e.g. 100" />
        </label>
      </section>

      <section class="stats">
        <div class="stat">
          <span class="stat-label">Total BTC held</span>
          <span class="stat-value" id="stat-btc">—</span>
        </div>
        <div class="stat">
          <span class="stat-label">BTC per share</span>
          <span class="stat-value" id="stat-bps">—</span>
        </div>
        <div class="stat">
          <span class="stat-label">Sats per share</span>
          <span class="stat-value" id="stat-sats">—</span>
        </div>
        <div class="stat">
          <span class="stat-label">Shares outstanding</span>
          <span class="stat-value" id="stat-shares">—</span>
        </div>
      </section>

      <section class="owned-panel" id="owned-stats">
        Enter the number of MSTR shares you own to estimate your look-through BTC.
      </section>

      <section class="chart-wrap">
        <div id="chart" aria-label="MSTR BTC per share chart"></div>
        <p class="hint">Scroll / pinch over the chart to zoom · drag the bar below to slide &amp; zoom a range.</p>
      </section>

      <footer class="footnote" id="footnote"></footer>
    </main>

    <script src="app.js"></script>
  </body>
</html>
